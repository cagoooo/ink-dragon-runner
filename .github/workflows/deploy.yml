name: Deploy to GitHub Pages 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies 📥
        run: pnpm install --no-frozen-lockfile

      - name: Build App 🏗️
        run: pnpm --filter "@workspace/ink-dragon-runner" run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: artifacts/ink-dragon-runner/dist/public
          branch: gh-pages
